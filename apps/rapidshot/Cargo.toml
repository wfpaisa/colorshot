[package]
name = "rapidshot"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rapidshot-core = { path = "../../crates/core" }
rapidshot-ui = { path = "../../crates/ui" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence", "accesskit"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
dirs = { version = "6", default-features = false }
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }

[dev-dependencies]
tempfile = "3.27.0"
